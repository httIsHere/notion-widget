        :root {
            --ink: #4a4658;
            --ink-soft: #8a8499;
            --deep: #3f3d56;
            --glass-bg: rgba(255, 255, 255, .5);
            --glass-border: rgba(255, 255, 255, .6);
            --shadow: 0 10px 30px rgba(120, 110, 160, .3);
            --radius: 28px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: "Baloo 2", "Quicksand", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
            color: var(--ink);
            min-height: 100%;
            /* display: flex;
            align-items: center;
            justify-content: center; */
            padding: clamp(12px, 3vw, 24px);
            background: #ffffff;
        }

        /* ===== 卡片 ===== */
        .card {
            position: relative;
            width: 100%;
            max-width: 280px;
            background: var(--glass-bg);
            backdrop-filter: blur(22px) saturate(140%);
            -webkit-backdrop-filter: blur(22px) saturate(140%);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: clamp(20px, 1vw, 30px);
            overflow: hidden;
            margin:  0 auto;
        }

        /* 卡片内部弥散光斑（衬在磨砂玻璃之下） */
        .inner-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(46px);
            opacity: .6;
            z-index: 0;
            pointer-events: none;
        }

        .inner-blob.i1 {
            width: 60%;
            height: 60%;
            background: #ffe3ec;
            top: -22%;
            left: -18%;
        }

        .inner-blob.i2 {
            width: 52%;
            height: 52%;
            background: #e0edff;
            bottom: -20%;
            right: -14%;
        }

        .inner-blob.i3 {
            width: 38%;
            height: 38%;
            background: #e6f4df;
            top: 38%;
            right: 6%;
        }

        .inner-blob.i4 {
            width: 30%;
            height: 30%;
            background: #fff3da;
            bottom: 4%;
            left: 12%;
        }

        /* ===== 头部 ===== */
        .card-head {
            position: relative;
            z-index: 1;
            margin-bottom: clamp(16px, 3vw, 22px);
        }

        .title {
            /* display: flex;
            flex-direction: column;
            gap: 2px; */
            display: flex;
            align-items: baseline;
            justify-content: space-between;
        }

        .title .month-en {
            font-family: "Baloo 2", "Quicksand", cursive;
            font-weight: 800;
            font-size: clamp(22px, 5vw, 28px);
            letter-spacing: .5px;
            color: var(--deep);
            line-height: 1.1;
        }

        .title .month-cn {
            font-size: clamp(12px, 2.6vw, 13px);
            color: var(--ink-soft);
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* ===== 星期表头 ===== */
        .weekdays,
        .days {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: clamp(4px, 1.6vw, 8px);
        }

        .weekdays {
            margin-bottom: clamp(8px, 2vw, 12px);
        }

        .weekdays span {
            text-align: center;
            font-size: clamp(14px, 3vw, 16px);
            font-weight: 700;
            color: var(--ink-soft);

    <script>
        (function () {
            const MONTH_EN = ["January", "February", "March", "April", "May", "June",
                "July", "August", "September", "October", "November", "December"];
            const MONTH_CN = ["一月", "二月", "三月", "四月", "五月", "六月",
                "七月", "八月", "九月", "十月", "十一月", "十二月"];
            const params = getAllParams(CryptoJS);
            handleDarkMode(params);
            console.log(params)

            const today = new Date();
            const viewYear = today.getFullYear();
            const viewMonth = today.getMonth();

            const daysEl = document.getElementById("days");
            document.getElementById("monthEn").textContent = MONTH_EN[viewMonth];
            document.getElementById("monthCn").textContent = MONTH_CN[viewMonth] + " · " + viewYear;
            document.getElementById("foot").innerHTML =
                "今天是 <b>" +viewYear+"年"+ (viewMonth + 1) + "月" + today.getDate() + "日</b>";

            // 周一开头：getDay() 0=周日 -> 索引 6
            const firstWeekday = (new Date(viewYear, viewMonth, 1).getDay() + 6) % 7;
            const total = new Date(viewYear, viewMonth + 1, 0).getDate();

            for (let i = 0; i < firstWeekday; i++) {
                const cell = document.createElement("div");
                cell.className = "day empty";
                daysEl.appendChild(cell);
            }

            for (let d = 1; d <= total; d++) {
                const cell = document.createElement("div");
                cell.className = "day";
                const _d = today.getDate();
                if (d === _d) cell.classList.add("today");
                if(d < _d) cell.classList.add("passed");
                const label = document.createElement("span");
                label.textContent = d;
                cell.appendChild(label);
                daysEl.appendChild(cell);
            }
        })();
    </script>
